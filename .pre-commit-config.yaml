repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint
        entry: uvx --from ruff==0.16.10 ruff check --fix
        language: system
        types: [python]
      - id: black
        name: Black formatter
        entry: uvx --from black==26.10.0 black
        language: system
        types: [python]
      - id: pyrefly
        name: Pyrefly type check
        entry: uv run pyrefly check
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: Run tests
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
