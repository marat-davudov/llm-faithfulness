[project]
name = "llm-faithfulness"
version = "0.1.0"
description = "Evaluate whether LLM Chain-of-Thought explanations are faithful or post-hoc rationalisations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.102",
    "boto3-stubs[bedrock-runtime]>=1.43.104",
    "botocore[crt]>=1.43.102",
    "environs>=15.2.0",
]

[project.scripts]
llm-faithfulness = "llm_faithfulness.faithfulness_evaluator:main"
generate-medqa-dataset = "llm_faithfulness.generate_medqa_dataset:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_faithfulness"]

[dependency-groups]
dev = [
    "pyrefly==1.3.2",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.black]
target-version = ["py312"]

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyrefly]
project-includes = ["src", "tests"]
search-path = ["src"]
python-version = "3.12"

[tool.mypy]
explicit_package_bases = true
mypy_path = "src"
